# 复制为 telegram.conf，并放到 tg-tools 二进制程序同级目录下。

# 必填，从 https://my.telegram.org 获取。
api_id=0

# 必填，从 https://my.telegram.org 获取。
api_hash=PUT_YOUR_API_HASH_HERE

# 留空时，登录时会提示输入手机号。
phone_number=

# TDLib 数据库目录。
database_directory=tdlib-db

# TDLib 文件缓存目录。
files_directory=tdlib-files

# 必填，TDLib 数据库加密密钥。首次登录后不要随意修改。
database_encryption_key=tgvideoclikey

# 上报给 TDLib 的语言代码。
system_language_code=zh-CN

# Telegram 活跃会话里显示的设备名称。
device_model=CLI

# 留空时交给 TDLib 自动处理。
system_version=

# 上报给 TDLib 的应用版本。
application_version=0.1.0
