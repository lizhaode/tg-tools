# Copy to config/telegram.conf. Environment variables don't override these keys.

# Required. From https://my.telegram.org.
api_id=0

# Required. From https://my.telegram.org.
api_hash=PUT_YOUR_API_HASH_HERE

# Empty means prompt during login.
phone_number=

# TDLib database directory.
database_directory=tdlib-db

# TDLib file cache directory.
files_directory=tdlib-files

# TDLib database encryption key. Keep stable after first login.
database_encryption_key=tgvideoclikey

# Language code reported to TDLib.
system_language_code=zh-CN

# Device name in Telegram active sessions.
device_model=CLI

# Empty lets TDLib handle it.
system_version=

# Application version reported to TDLib.
application_version=0.1.0
